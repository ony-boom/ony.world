# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ony-boom/ony.world
  branch: main

# Media lives in Garage (self-hosted S3) on hizuru. `endpoint` and `acl` are
# undocumented but supported; see garage.md in the remote-os repo. The Secret
# Access Key is not stored here, Sveltia prompts for it.
# The secret is 40 base64-alphabet chars on purpose: Sveltia validates it in
# the browser against /^[A-Za-z0-9\/+=]{40}$/ before it ever signs a request, so
# a stock 64-hex Garage secret is rejected as "invalid" without touching S3.
# Imported with `garage key import`.
media_libraries:
  # Internal (git-backed) storage is the default target, and the Asset Library
  # page only ever writes there -- that is how watercolorswirls.png ended up
  # committed to the repo. Turn it off so every upload goes to Garage.
  default: false
  aws_s3:
    endpoint: https://s3.ony.world
    public_url: https://media.ony.world
    bucket: media
    region: garage
    access_key_id: GK7d5c6bde0269c77623f54192
    acl: false

# Unused while `default: false` above, kept so re-enabling internal storage is
# a one-line change.
media_folder: /static/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: /src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{title}}'
    sortable_fields: [date, title]
    view_groups:
      - label: Status
        field: published
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string, required: false, default: '' }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: published, label: Published, widget: boolean, default: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: coverUrl, label: Cover, widget: file, required: false }
      - { name: coverAlt, label: Cover alt text, widget: string, required: false, default: '' }
      # Rich text first (Ghost-ish), raw markdown one click away in the toolbar.
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]
        editor_components: [code-block, image, video]

  - name: projects
    label: Projects
    label_singular: Project
    folder: /src/content/projects
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{title}}'
    sortable_fields: [date, title]
    view_groups:
      - label: Status
        field: published
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string, required: false, default: '' }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: published, label: Published, widget: boolean, default: false }
      - { name: coverUrl, label: Cover, widget: file, required: false }
      - { name: coverAlt, label: Cover alt text, widget: string, required: false, default: '' }
      - name: body
        label: Body
        widget: richtext
        modes: [rich_text, raw]
        editor_components: [code-block, image, video]
